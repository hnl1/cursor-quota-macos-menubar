<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>额度面板预览</title>
<style>
  :root {
    color-scheme: dark;
    --text: #f5f5f7;
    --secondary: rgba(255, 255, 255, 0.72);
    --tertiary: rgba(255, 255, 255, 0.72);
    --line: rgba(255, 255, 255, 0.16);
    --hover: rgba(255, 255, 255, 0.1);
    --icon: rgba(255, 255, 255, 0.82);
    --icon-dim: rgba(255, 255, 255, 0.32);
    --icon-disabled: rgba(255, 255, 255, 0.28);
    --box-fill: rgba(255, 255, 255, 0.12);
    --box-stroke: rgba(255, 255, 255, 0.28);
    --box-fill-dim: rgba(255, 255, 255, 0.05);
    --box-stroke-dim: rgba(255, 255, 255, 0.14);
    --material: rgba(18, 18, 20, 0.32);
    --material-stroke: rgba(255, 255, 255, 0.16);
    --green: #30d158;
    --orange: #ff9f0a;
  }

  body.light {
    color-scheme: light;
    --text: #1d1d1f;
    --secondary: rgba(0, 0, 0, 0.55);
    --tertiary: rgba(0, 0, 0, 0.42);
    --line: rgba(0, 0, 0, 0.12);
    --hover: rgba(0, 0, 0, 0.06);
    --icon: rgba(0, 0, 0, 0.78);
    --icon-dim: rgba(0, 0, 0, 0.32);
    --icon-disabled: rgba(0, 0, 0, 0.28);
    --box-fill: rgba(0, 0, 0, 0.06);
    --box-stroke: rgba(0, 0, 0, 0.2);
    --box-fill-dim: rgba(0, 0, 0, 0.03);
    --box-stroke-dim: rgba(0, 0, 0, 0.1);
    --material: rgba(255, 255, 255, 0.42);
    --material-stroke: rgba(255, 255, 255, 0.62);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #1a2433;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wallpaper {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: linear-gradient(90deg, #3f74a4 0%, #6aa4cc 46%, #e3a888 54%, #c47856 100%);
  }

  body.light { background: #e7f2f8; }
  body.light .wallpaper {
    background: linear-gradient(90deg, #8ec4e6 0%, #d4ebf6 46%, #f8d8c6 54%, #f0b898 100%);
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 24px 48px;
  }

  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }

  .lead {
    margin: 6px 0 0;
    color: var(--secondary);
    font-size: 13px;
    line-height: 1.45;
  }

  .stage {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 36px;
    margin-top: 28px;
    align-items: flex-start;
  }

  .column { width: 340px; }

  .column h2 {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 500;
    color: var(--secondary);
  }

  .menubar,
  .popover {
    background: var(--material);
    background-clip: padding-box;
    border: 1px solid var(--material-stroke);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(22px) saturate(1.45);
    -webkit-backdrop-filter: blur(22px) saturate(1.45);
  }

  .menubar {
    height: 30px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: 0 10px 0 12px;
  }

  .menu-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .menu-group.rings-only { gap: 1px; }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 1px;
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .menu-icons {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--icon);
  }

  .popover {
    position: relative;
    width: 308px;
    margin: 6px 0 0 auto;
    border-radius: 12px;
    padding: 14px 14px 12px;
    user-select: none;
  }

  .old-head, .new-head, .old-foot, .new-foot, .old-line, .new-line {
    display: flex;
    align-items: center;
  }

  .old-head { height: 16px; }
  .new-head { min-height: 22px; gap: 8px; }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 22px;
    margin: 0;
    padding: 0 6px 0 4px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--secondary);
    font: inherit;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    cursor: default;
  }

  .refresh-btn:hover { background: var(--hover); }

  .refresh-btn .icon {
    width: 13px;
    height: 13px;
  }

  .old-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .new-title {
    font-size: 13px;
    font-weight: 600;
    margin-right: auto;
  }

  .old-status, .clock, .hint, .reset, .sub, .plan-old, .spend-old {
    font-size: 11px;
  }

  .old-status, .clock, .hint, .reset, .plan-old {
    color: var(--secondary);
  }

  .clock { font-variant-numeric: tabular-nums; }

  .hint {
    margin: 8px 0 2px;
    line-height: 1.35;
  }

  .old-row {
    display: grid;
    grid-template-columns: 44px 1fr 18px;
    column-gap: 10px;
    align-items: center;
    height: 52px;
    margin-top: 8px;
  }

  .old-copy { min-width: 0; }

  .old-line { justify-content: space-between; gap: 8px; }
  .old-line + .old-line { margin-top: 4px; }

  .name {
    font-size: 12px;
    font-weight: 600;
  }

  .pct {
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .old-sub {
    font-size: 11px;
    font-weight: 500;
  }

  .old-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .box {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1px solid var(--box-stroke);
    background: var(--box-fill);
    color: var(--text);
    display: grid;
    place-items: center;
    padding: 0;
  }

  .box.dim {
    color: var(--tertiary);
    background: var(--box-fill-dim);
    border-color: var(--box-stroke-dim);
  }

  .rule {
    height: 1px;
    margin: 8px 0 0;
    background: var(--line);
  }

  .old-meta {
    margin-top: 10px;
    text-align: right;
  }

  .plan-old { font-weight: 500; color: var(--text); }
  .spend-old { margin-top: 2px; font-weight: 500; }

  .old-foot {
    margin-top: 8px;
    gap: 8px;
  }

  .reset { margin-right: auto; }

  .text-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 22px;
    padding: 0 6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
  }

  .new-list { margin-top: 8px; position: relative; }

  .new-row {
    position: relative;
    z-index: 0;
    display: grid;
    grid-template-columns: 44px 1fr auto;
    column-gap: 10px;
    align-items: center;
    min-height: 52px;
    padding: 4px 2px 4px 2px;
    border-radius: 8px;
    touch-action: none;
    transition: transform 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .new-row:hover { background: var(--hover); }

  .new-row.dragging {
    z-index: 2;
    transition: none;
    background: rgba(255, 255, 255, 0.16);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.32);
  }

  body.light .new-row.dragging {
    background: rgba(255, 255, 255, 0.78);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.14);
  }

  #next { cursor: pointer; }
  #next button { cursor: default; }

  body.dragging-row #next,
  body.dragging-row #next button { cursor: grabbing; }

  body.dragging-row #next .new-list { z-index: 3; }

  .new-line { justify-content: space-between; gap: 8px; }
  .new-line + .new-line { margin-top: 3px; }

  .new-pct { font-size: 13px; }

  .quiet {
    color: var(--tertiary);
    font-size: 11px;
    font-weight: 400;
  }

  .quiet-pct {
    color: var(--tertiary);
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .slot {
    display: flex;
    align-items: center;
  }

  .icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    color: var(--icon);
    display: grid;
    place-items: center;
  }

  button.icon {
    border: 0;
    background: transparent;
    padding: 0;
    cursor: default;
  }

  button.icon:hover { background: var(--hover); }

  .icon.off { color: var(--icon-dim); }

  .option {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 22px;
    margin: 0;
    padding: 0 4px 0 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--secondary);
    font: inherit;
    font-size: 11px;
    cursor: default;
  }

  .option:hover { background: var(--hover); }

  .new-foot {
    margin-top: 14px;
    gap: 8px;
    align-items: flex-end;
  }

  .foot-copy { min-width: 0; margin-right: auto; }

  .foot-actions {
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }
  .plan-new { font-size: 12px; font-weight: 500; }
  .spend-new { margin-top: 2px; font-size: 11px; color: var(--secondary); }
  .spend-new b { font-weight: 500; color: var(--text); }

  .caption {
    margin: 10px 0 0;
    color: var(--tertiary);
    font-size: 12px;
    line-height: 1.45;
  }

  .tools {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .tools button {
    height: 24px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--secondary);
    font: inherit;
    font-size: 12px;
    cursor: default;
  }

  .tools button[aria-pressed="true"] {
    color: var(--text);
    border-color: var(--icon-dim);
  }

  .choices {
    margin-top: 36px;
  }

  .choices h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
  }

  .choices p {
    margin: 6px 0 0;
    color: var(--secondary);
    font-size: 12px;
    line-height: 1.45;
  }

  .choice {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 16px;
  }

  .choice b {
    width: 7em;
    font-size: 12px;
    font-weight: 500;
  }

  .choice .pair {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    color: var(--text);
  }

  .choice .pair span {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--secondary);
  }

  .spinning svg { animation: turn 0.7s linear infinite; }

  @keyframes turn { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <div class="page">
    <h1>面板预览</h1>
    <p class="lead">面板是磨砂半透明，后面的色块会透进来。真菜单会跟着系统切换浅色和暗色，这里可以来回看。</p>
    <div class="tools" id="appearance">
      <button type="button" data-tone="dark" aria-pressed="true">暗色菜单</button>
      <button type="button" data-tone="light" aria-pressed="false">浅色菜单</button>
    </div>
    <div class="stage">
      <section class="column">
        <h2>现在</h2>
        <div class="menubar" id="old-bar"></div>
        <div class="popover" id="old"></div>
      </section>
      <section class="column">
        <h2>改后</h2>
        <div class="menubar" id="new-bar"></div>
        <div class="popover" id="next"></div>
        <p class="caption">单击一行就会选中或取消。按住并移动才是拖动排序。</p>
      </section>
    </div>
    <section class="choices">
      <h2>重启和刷新怎么分开</h2>
      <p>每一组左边是刷新，中间是重启，右边是退出。小的是菜单里的 13 像素，大的是同一张图放大，方便看形状。面板本身还没改。</p>
      <div class="choice">
        <b>现在</b>
        <div class="pair">
          <span>刷新<svg width="13" height="13" viewBox="0 0 13 13"><path d="M10.6 4.2 A4.2 4.2 0 1 0 11 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 1.6 V4.3 H7.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M10.6 4.2 A4.2 4.2 0 1 0 11 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 1.6 V4.3 H7.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>双箭头<svg width="13" height="13" viewBox="0 0 13 13"><path d="M2.6 5.2 A4.15 4.15 0 0 1 10.2 4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8.6 2.6 L10.4 4.3 L8.4 5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.4 7.8 A4.15 4.15 0 0 1 2.8 8.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M4.4 10.4 L2.6 8.7 L4.6 7.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M2.6 5.2 A4.15 4.15 0 0 1 10.2 4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8.6 2.6 L10.4 4.3 L8.4 5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.4 7.8 A4.15 4.15 0 0 1 2.8 8.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M4.4 10.4 L2.6 8.7 L4.6 7.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>退出<svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1.4 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.3 3.3 A4.15 4.15 0 1 0 9.7 3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M6.5 1.4 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.3 3.3 A4.15 4.15 0 1 0 9.7 3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
        </div>
      </div>
      <div class="choice">
        <b>方框回环</b>
        <div class="pair">
          <span>刷新<svg width="13" height="13" viewBox="0 0 13 13"><path d="M10.6 4.2 A4.2 4.2 0 1 0 11 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 1.6 V4.3 H7.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M10.6 4.2 A4.2 4.2 0 1 0 11 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 1.6 V4.3 H7.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>重启<svg width="13" height="13" viewBox="0 0 13 13"><path d="M2.4 4.2 H8.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.2 2.8 L8.8 4.2 L7.2 5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.6 4.2 V7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 8.6 H4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M5.8 7.2 L4.2 8.6 L5.8 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.4 8.6 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M2.4 4.2 H8.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.2 2.8 L8.8 4.2 L7.2 5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.6 4.2 V7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 8.6 H4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M5.8 7.2 L4.2 8.6 L5.8 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.4 8.6 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
          <span>退出<svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1.4 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.3 3.3 A4.15 4.15 0 1 0 9.7 3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M6.5 1.4 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.3 3.3 A4.15 4.15 0 1 0 9.7 3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
        </div>
      </div>
      <div class="choice">
        <b>折返</b>
        <div class="pair">
          <span>刷新<svg width="13" height="13" viewBox="0 0 13 13"><path d="M10.6 4.2 A4.2 4.2 0 1 0 11 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 1.6 V4.3 H7.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M10.6 4.2 A4.2 4.2 0 1 0 11 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 1.6 V4.3 H7.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>重启<svg width="13" height="13" viewBox="0 0 13 13"><path d="M3 3.4 H8.2 A2.5 2.5 0 0 1 8.2 8.4 H3.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.8 6.8 L3.2 8.4 L4.8 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M3 3.4 H8.2 A2.5 2.5 0 0 1 8.2 8.4 H3.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.8 6.8 L3.2 8.4 L4.8 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>退出<svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1.4 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.3 3.3 A4.15 4.15 0 1 0 9.7 3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M6.5 1.4 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.3 3.3 A4.15 4.15 0 1 0 9.7 3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
        </div>
      </div>
      <div class="choice">
        <b>重新打开</b>
        <div class="pair">
          <span>刷新<svg width="13" height="13" viewBox="0 0 13 13"><path d="M10.6 4.2 A4.2 4.2 0 1 0 11 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 1.6 V4.3 H7.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M10.6 4.2 A4.2 4.2 0 1 0 11 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M10.6 1.6 V4.3 H7.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>重启<svg width="13" height="13" viewBox="0 0 13 13"><rect x="5.4" y="2.2" width="5.6" height="8.6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.4 6.5 H6.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M4.6 4.9 L6.4 6.5 L4.6 8.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><rect x="5.4" y="2.2" width="5.6" height="8.6" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.4 6.5 H6.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M4.6 4.9 L6.4 6.5 L4.6 8.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>退出<svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1.4 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.3 3.3 A4.15 4.15 0 1 0 9.7 3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><svg width="36" height="36" viewBox="0 0 13 13"><path d="M6.5 1.4 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.3 3.3 A4.15 4.15 0 1 0 9.7 3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
        </div>
      </div>
    </section>
  </div>
  <script>
    const pools = {
      cursor: { title: "Cursor 模型剩余", timeTitle: "周期剩余", usage: 0.97, time: 0.97, color: "#30d158" },
      api: { title: "其他模型剩余", timeTitle: "周期剩余", usage: 0.63, time: 0.97, color: "#ff9f0a" },
      grok: { title: "Grok Bot 剩余", timeTitle: "本周剩余", usage: 1, time: 0.37, color: "#30d158" }
    };

    const state = {
      order: ["cursor", "api", "grok"],
      hidden: new Set(),
      spinning: false,
      refreshedAt: new Date(),
      showPercent: true
    };

    const chevron = (up) => `
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
        <path d="${up ? "M2 6.4 L5 3.4 L8 6.4" : "M2 3.6 L5 6.6 L8 3.6"}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    const check = `
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
        <path d="M2 5.2 L4.1 7.2 L8 2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    const menubarIcon = (on) => on
      ? `<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><path d="M2.2 6.7 L5.1 9.6 L10.8 3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : `<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`;

    const restartIcon = `
      <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
        <path d="M2.6 5.2 A4.15 4.15 0 0 1 10.2 4.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M8.6 2.6 L10.4 4.3 L8.4 5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10.4 7.8 A4.15 4.15 0 0 1 2.8 8.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M4.4 10.4 L2.6 8.7 L4.6 7.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    const powerIcon = `
      <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
        <path d="M6.5 1.4 V5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M3.3 3.3 A4.15 4.15 0 1 0 9.7 3.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>`;

    const refreshIcon = `
      <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
        <path d="M10.6 4.2 A4.2 4.2 0 1 0 11 7.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M10.6 1.6 V4.3 H7.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    const refreshSpinIcon = `
      <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
        <circle cx="6.5" cy="6.5" r="4.15" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="20 6.1"/>
      </svg>`;

    const mailIcon = `
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <rect x="1.2" y="2.6" width="11.6" height="8.8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M1.8 3.4 L7 7.3 L12.2 3.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>`;

    function ring(usage, time, color, size, stroke, cap, track, spoke) {
      const pad = cap === "round" ? 2.2 : 1.6;
      const r = (size - stroke) / 2 - pad;
      const c = 2 * Math.PI * r;
      const full = usage >= 0.999;
      const minGap = cap === "round" ? stroke * 1.35 : 2;
      const dash = full ? c : Math.min(Math.max(usage, 0.06) * c, c - minGap);
      const gap = c - dash;
      const rad = (90 - 360 * time) * Math.PI / 180;
      const cx = size / 2;
      const cy = size / 2;
      const dx = Math.cos(rad);
      const dy = Math.sin(rad);
      const tick = Math.max(1.15, stroke * 0.34);
      const tickOut = Math.max(1.2, stroke * 0.42);
      const inner = spoke ? 0 : r - stroke / 2 - tickOut;
      const outer = spoke ? r + stroke / 2 : r + stroke / 2 + tickOut;
      const x1 = cx + dx * inner;
      const y1 = cy - dy * inner;
      const x2 = cx + dx * outer;
      const y2 = cy - dy * outer;
      const arc = full
        ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"/>`
        : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="${cap}" stroke-dasharray="${dash} ${gap}" transform="rotate(-90 ${cx} ${cy})"/>`;
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
        ${arc}
        <line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${ink(0.78)}" stroke-width="${tick}" stroke-linecap="${spoke ? "butt" : "round"}"/>
      </svg>`;
    }

    function ink(alpha) {
      const channel = document.body.classList.contains("light") ? "0,0,0" : "255,255,255";
      return `rgba(${channel},${alpha})`;
    }

    function pct(value) {
      return `${Math.round(value * 100)}%`;
    }

    function menuItems(order, hidden, showsPercent, spoke) {
      const shown = order.filter((id) => !hidden.has(id));
      const group = showsPercent ? "menu-group" : "menu-group rings-only";
      return `<div class="${group}">${shown.map((id) => {
        const pool = pools[id];
        const label = showsPercent ? pct(pool.usage) : "";
        return `<span class="menu-item">${ring(pool.usage, pool.time, pool.color, 22, 3, "butt", ink(0.16), spoke)}${label}</span>`;
      }).join("")}</div>
      <div class="menu-icons">${mailIcon}
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M7 4.2 V7.2 L9 8.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </div>`;
    }

    function clockText(date) {
      const pad = (value) => String(value).padStart(2, "0");
      return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function renderOld() {
      document.getElementById("old-bar").innerHTML = menuItems(["cursor", "api", "grok"], new Set(), true, false);
      const rows = ["cursor", "api", "grok"].map((id, index, all) => {
        const pool = pools[id];
        const upDim = index === 0 ? " dim" : "";
        const downDim = index === all.length - 1 ? " dim" : "";
        return `
          ${index ? '<div class="rule"></div>' : ""}
          <div class="old-row">
            ${ring(pool.usage, pool.time, pool.color, 44, 5, "butt", ink(0.22), false)}
            <div class="old-copy">
              <div class="old-line"><span class="name">${pool.title}</span><span class="pct" style="color:${pool.color}">${pct(pool.usage)}</span></div>
              <div class="old-line"><span class="old-sub">${pool.timeTitle}</span><span class="old-sub">${pct(pool.time)}</span></div>
            </div>
            <div class="old-controls">
              <span class="box${upDim}">${chevron(true)}</span>
              <span class="box">${check}</span>
              <span class="box${downDim}">${chevron(false)}</span>
            </div>
          </div>`;
      }).join("");
      document.getElementById("old").innerHTML = `
        <div class="old-head">
          <div class="old-title">CURSOR 额度</div>
          <div class="old-status" style="margin-left:auto">更新于 10:39</div>
        </div>
        <div class="hint">勾选的显示在菜单栏，箭头调整顺序</div>
        ${rows}
        <div class="old-meta">
          <div class="plan-old">Ultra · $200/mo</div>
          <div class="spend-old">已用 $178.49 / $400.00</div>
        </div>
        <div class="old-foot">
          <div class="reset">重置 10月21日 11:37</div>
          <span class="text-btn">${refreshIcon}刷新</span>
          <span class="text-btn">${powerIcon}退出</span>
        </div>`;
    }

    function renderNext() {
      document.getElementById("new-bar").innerHTML = menuItems(state.order, state.hidden, state.showPercent, true);
      const rows = state.order.map((id, index, all) => {
        const pool = pools[id];
        const on = !state.hidden.has(id);
        return `
          <div class="new-row" data-id="${id}" aria-pressed="${on}">
            ${ring(pool.usage, pool.time, pool.color, 44, 5, "butt", ink(0.22), true)}
            <div>
              <div class="new-line">
                <span class="name">${pool.title}</span>
                <span class="pct new-pct" style="color:${pool.color}">${pct(pool.usage)}</span>
              </div>
              <div class="new-line">
                <span class="quiet">${pool.timeTitle}</span>
                <span class="quiet-pct">${pct(pool.time)}</span>
              </div>
            </div>
            <div class="slot">
              <span class="icon vis" aria-hidden="true">${on ? menubarIcon(true) : ""}</span>
            </div>
          </div>`;
      }).join("");

      document.getElementById("next").innerHTML = `
        <div class="new-head">
          <div class="new-title">Cursor 额度</div>
          <button type="button" class="option" id="show-percent" aria-pressed="${state.showPercent}">
            <span class="icon vis" aria-hidden="true">${state.showPercent ? menubarIcon(true) : ""}</span>
            <span>菜单栏 %</span>
          </button>
          <button type="button" class="refresh-btn" id="refresh" aria-label="刷新" title="刷新">
            <span class="icon${state.spinning ? " spinning" : ""}">${state.spinning ? refreshSpinIcon : refreshIcon}</span>
            <span class="clock" id="clock">${clockText(state.refreshedAt)}</span>
          </button>
        </div>
        <div class="new-list">${rows}</div>
        <div class="new-foot">
          <div class="foot-copy">
            <div class="plan-new">Ultra · $200/mo</div>
            <div class="spend-new"><b>已用 $178.49 / $400</b> · 10月21日重置</div>
          </div>
          <div class="foot-actions">
            <button type="button" class="icon" id="restart" aria-label="重启" title="重启">${restartIcon}</button>
            <button type="button" class="icon" id="power" aria-label="退出" title="退出">${powerIcon}</button>
          </div>
        </div>`;
    }

    document.getElementById("next").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.id === "show-percent") {
        state.showPercent = !state.showPercent;
        renderNext();
        return;
      }
      if (button.id !== "refresh") return;
      state.spinning = true;
      renderNext();
      window.setTimeout(() => {
        state.spinning = false;
        state.refreshedAt = new Date();
        renderNext();
      }, 900);
    });

    function toggleRow(id) {
      if (state.hidden.has(id)) state.hidden.delete(id);
      else if (state.order.filter((key) => !state.hidden.has(key)).length > 1) state.hidden.add(id);
      renderNext();
    }

    let drag = null;

    function rowNodes() {
      return [...document.querySelectorAll("#next .new-row")];
    }

    function previewOrder() {
      const order = state.order.slice();
      const [item] = order.splice(drag.from, 1);
      order.splice(drag.to, 0, item);
      return order;
    }

    function applyDrag(pointerY) {
      const rows = rowNodes();
      const from = drag.from;
      const height = drag.height;
      const rawTop = drag.tops[from] + (pointerY - drag.startY);
      const top = Math.min(drag.panelBottom - height, Math.max(drag.panelTop, rawTop));
      const center = top + height / 2;
      let to = 0;
      for (let index = 0; index < drag.centers.length; index += 1) {
        if (index !== from && drag.centers[index] < center) to += 1;
      }
      rows.forEach((row, index) => {
        if (index === from) {
          const dy = top - drag.tops[from];
          row.style.transform = `translateY(${dy}px) scale(1.02)`;
          return;
        }
        let offset = 0;
        if (to > from && index > from && index <= to) offset = -height;
        if (to < from && index >= to && index < from) offset = height;
        row.style.transform = offset ? `translateY(${offset}px)` : "";
      });
      if (to !== drag.to) {
        drag.to = to;
        document.getElementById("new-bar").innerHTML = menuItems(previewOrder(), state.hidden, state.showPercent, true);
      }
    }

    function beginDrag(row) {
      const rows = rowNodes();
      const from = rows.indexOf(row);
      const boxes = rows.map((item) => item.getBoundingClientRect());
      const panel = document.getElementById("next").getBoundingClientRect();
      drag.active = true;
      drag.from = from;
      drag.to = from;
      drag.height = boxes[from].height;
      drag.tops = boxes.map((box) => box.top);
      drag.centers = boxes.map((box) => box.top + box.height / 2);
      drag.panelTop = panel.top + 6;
      drag.panelBottom = panel.bottom - 6;
      row.classList.add("dragging");
      document.body.classList.add("dragging-row");
      applyDrag(drag.pointerY);
    }

    function finishDrag() {
      const rows = rowNodes();
      const from = drag.from;
      const to = drag.to;
      rows.forEach((row) => {
        row.style.transition = "none";
        row.style.transform = "";
        row.classList.remove("dragging");
      });
      if (from !== to) {
        const list = document.querySelector("#next .new-list");
        const row = rows[from];
        const target = rows[to];
        if (from < to) list.insertBefore(row, target.nextSibling);
        else list.insertBefore(row, target);
        state.order = previewOrder();
        document.getElementById("new-bar").innerHTML = menuItems(state.order, state.hidden, state.showPercent, true);
      }
      document.body.classList.remove("dragging-row");
      requestAnimationFrame(() => {
        rows.forEach((row) => {
          row.style.transition = "";
        });
      });
      drag = null;
    }

    document.getElementById("next").addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || event.target.closest("button")) return;
      const row = event.target.closest(".new-row");
      if (!row) return;
      drag = {
        id: row.dataset.id,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        pointerY: event.clientY,
        active: false
      };
      row.setPointerCapture(event.pointerId);
    });

    document.getElementById("next").addEventListener("pointermove", (event) => {
      if (!drag || event.pointerId !== drag.pointerId) return;
      drag.pointerY = event.clientY;
      const row = document.querySelector(`#next .new-row[data-id="${drag.id}"]`);
      if (!row) return;
      if (!drag.active) {
        const moved = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
        if (moved < 4) return;
        beginDrag(row);
        return;
      }
      applyDrag(event.clientY);
    });

    function endDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      if (!drag.active) {
        const id = drag.id;
        drag = null;
        toggleRow(id);
        return;
      }
      finishDrag();
    }

    document.getElementById("next").addEventListener("pointerup", endDrag);
    document.getElementById("next").addEventListener("pointercancel", endDrag);

    document.getElementById("appearance").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const light = button.dataset.tone === "light";
      document.body.classList.toggle("light", light);
      for (const item of document.querySelectorAll("#appearance button")) {
        item.setAttribute("aria-pressed", String(item === button));
      }
      renderOld();
      renderNext();
    });

    renderOld();
    renderNext();
  </script>
</body>
</html>
